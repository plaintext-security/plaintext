name: Deploy to Cloudflare Pages

# Builds the MkDocs site in CI — where we CAN read the private plaintext-labs
# submodule (via a token) — and uploads ONLY the static ./site output to
# Cloudflare Pages via Direct Upload. Cloudflare never accesses the source: it
# receives built HTML only, so both repos stay private and hosting stays free.
#
# Required secrets (Settings → Secrets and variables → Actions):
#   LABS_TOKEN            fine-grained PAT, read-only "Contents" on BOTH
#                         plaintext and plaintext-labs (clones the private
#                         cross-repo submodule; default GITHUB_TOKEN cannot).
#   CLOUDFLARE_API_TOKEN  Cloudflare token with the "Cloudflare Pages: Edit"
#                         permission.
#   CLOUDFLARE_ACCOUNT_ID your Cloudflare account id.
# Create the Pages project once (name must match --project-name below):
#   Cloudflare dashboard → Workers & Pages → Create → Pages → Direct Upload.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (incl. private plaintext-labs submodule)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          submodules: true
          # Used for the main checkout AND submodule fetch, so this PAT must be
          # able to read both plaintext and plaintext-labs.
          token: ${{ secrets.LABS_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'

      - name: Install MkDocs
        run: pip install -r requirements.txt

      - name: Build site
        run: mkdocs build --strict

      - name: Deploy to Cloudflare Pages (Direct Upload)
        # TODO: SHA-pin to match the repo's action-pinning convention.
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=plaintext-9pa --branch=main

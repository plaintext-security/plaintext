name: Build (PR gate)

# Pre-merge build gate: catch a broken `mkdocs build --strict` before it
# reaches main. Deploy (deploy.yml) still runs the same build on push to main.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
        with:
          submodules: true   # resolve the plaintext-labs lab.md symlinks (deploy.yml already does this)
      - name: Setup Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install -r requirements.txt
      - name: Build site (strict)
        run: mkdocs build --strict

name: Build (PR gate)

# Pre-merge build gate: catch a broken `mkdocs build --strict` before it
# reaches main. Deploy (deploy.yml) still runs the same build on push to main.
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: true   # resolve the plaintext-labs lab.md symlinks (deploy.yml already does this)
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.x'
      - name: Install MkDocs
        run: pip install -r requirements.txt
      - name: Build site (strict)
        run: mkdocs build --strict
